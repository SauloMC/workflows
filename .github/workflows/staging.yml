name: Staging deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    environment:
      name: staging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: python -m compileall .

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Deploy to staging
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || 22 }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/workflow-demo' }}
          APP_NAME: workflow-demo
        shell: bash
        run: |
          if [[ -z "${DEPLOY_HOST}" || -z "${DEPLOY_USER}" ]]; then
            echo "::warning::DEPLOY_HOST/DEPLOY_USER not configured — skipping actual SSH deploy (demo mode)."
            echo "Pipeline passed: lint ✓  tests ✓  build ✓  deploy skipped (no server configured)"
            exit 0
          fi
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh staging

      - name: Publish deployment URL
        if: success()
        run: |
          echo "Staging deployment succeeded for ${{ github.repository }}@${{ github.ref_name }}"
          echo "Environment URL: https://${{ vars.STAGING_URL || 'staging.example.com' }}"
